<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Search and filter job opportunities.">
  <title>JobTrack | Job Search</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-layout">
      <a class="site-title" href="landing.html">JobTrack</a>
      <nav aria-label="Main navigation" class="top-nav">
        <a href="landing.html">Landing</a>
        <a href="auth.html">Log In / Sign Up</a>
      </nav>
    </div>
  </header>
  <main class="container app-layout">
      <aside class="sidebar">
        <h2 class="sidebar-title">JobTrack</h2>
        <nav aria-label="App navigation" class="sidebar-nav">
        <a class="" href="index.html">Dashboard</a>
        <a class="current-page" href="jobs.html">Job Board</a>
        <a class="" href="applications.html">Applications</a>
        <a class="" href="analytics.html">Analytics</a>
        <a class="" href="settings.html">Settings</a>
        </nav>
      </aside>
      <section class="app-content">
        <section class="jobs-hero">
          <div>
            <p class="eyebrow-text">Find your next opportunity</p>
            <h1>Discover jobs that fit your goals.</h1>
            <p class="muted-text">Search roles, compare opportunities, and track the jobs you care about most</p>
          </div>
          <a class="button" href="add-job.html">Add Jobs</a>
        </section>

        <section class="card panel">
          <form class="form" action="jobs.html">
            <div class="search-bar">
              <input id="job-search" name="job-search" type="search">
              <button class="button" type="submit">Search</button>
            </div>

            <div class="Filter" aria-label="Quick Filter">
              <a href="#" class="all jobs">All Jobs</a>
              <a href="#" class="job">Remote</a>
              <a href="#" class="job">Internship</a>
              <a href="#" class="job">Visa Sponsorship</a>
              <a href="#" class="job">Seattle</a>
            </div>

            <div class="settings-grid">
              <div class="form-row">
                <label for="location">Location</label>
                <select id="location" name="location">
                  <option>Any location</option>
                  <option>Seattle</option>
                  <option>San Francisco</option>
                  <option>Remote</option>
                </select>
              </div>
              <div class="form-row">
                <label for="salary">Salary Range</label>
                <select id="salary" name="salary">
                  <option>Any Salary</option>
                  <option>$60k-$100k</option>
                  <option>$100k-$140k</option>
                  <option>$140k+</option>
                </select>
              </div>
              <div class="form-row">
                <label for="experience">Experience level</label>
                <select id="experience" name="experience">
                  <option>Any level</option>
                  <option>Entry</option>
                  <option>Internship</option>
                  <option>Professional</option>
                </select>
              </div>
              <div class="form-row">
                <label for="sponsorship">Visa Sponsorship</label>
                <select id="sponsorship" name="sponsorship">
                  <option>Any</option>
                  <option>Sponsors visa</option>
                  <option>No sponsorship</option>
                </select>
              </div>
            </div>
          </form>
        </section>
      </section>

      <section class="job-board-layout">
        <div id="jobs-root"></div>
      </section>
      
      <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
      <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
      <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
      
      <script type="text/babel">
        function JobsApp() {
          const [search, setSearch] = React.useState("");
          const [filter, setFilter] = React.useState("All Jobs");
      
          const jobs = [
            {
              company: "Google",
              title: "Software Engineer Intern",
              location: "Seattle",
              workType: "Hybrid",
              pay: "$50/hr",
              tags: ["Internship", "Visa Sponsorship", "Deadline Soon"]
            },
            {
              company: "Stripe",
              title: "Frontend Engineer",
              location: "San Francisco",
              workType: "Full-time",
              pay: "$140k+",
              tags: ["Frontend", "Entry Level"]
            },
            {
              company: "Airbnb",
              title: "Product Designer",
              location: "Remote",
              workType: "Full-time",
              pay: "$120k",
              tags: ["Remote", "Design"]
            },
            {
              company: "Meta",
              title: "Data Analyst",
              location: "Menlo Park",
              workType: "Internship",
              pay: "$45/hr",
              tags: ["Data", "Internship"]
            }
          ];
      
          const filteredJobs = jobs.filter((job) => {
            const searchText = search.toLowerCase();
      
            const matchesSearch =
              job.company.toLowerCase().includes(searchText) ||
              job.title.toLowerCase().includes(searchText) ||
              job.location.toLowerCase().includes(searchText) ||
              job.tags.join(" ").toLowerCase().includes(searchText);
      
            const matchesFilter =
              filter === "All Jobs" ||
              job.location === filter ||
              job.workType === filter ||
              job.tags.includes(filter);
      
            return matchesSearch && matchesFilter;
          });
      
          return (
            <div>
              <section className="card panel">
                <div className="search-bar">
                  <input
                    id="job-search"
                    type="search"
                    placeholder="Search jobs..."
                    value={search}
                    onChange={(event) => setSearch(event.target.value)}
                  />
                  <button className="button" type="button">Search</button>
                </div>
      
                <div className="Filter" aria-label="Quick Filter">
                  {["All Jobs", "Remote", "Internship", "Visa Sponsorship", "Seattle"].map((item) => (
                    <button
                      key={item}
                      className="job"
                      type="button"
                      onClick={() => setFilter(item)}
                    >
                      {item}
                    </button>
                  ))}
                </div>
              </section>
      
              <div className="job-list">
                {filteredJobs.map((job, index) => (
                  <article className="card job-card" key={index}>
                    <p className="job-company">{job.company}</p>
                    <h3>{job.title}</h3>
                    <p>{job.location} · {job.workType} · {job.pay}</p>
      
                    <div className="tag-row">
                      {job.tags.map((tag) => (
                        <span className="tag" key={tag}>{tag}</span>
                      ))}
                    </div>
      
                    <div className="job-actions">
                      <a className="button" href="detail.html">View Details</a>
                      <button
                        className="button secondary-button"
                        type="button"
                        onClick={(event) => {
                          event.target.textContent = "Tracked";
                        }}
                      >
                        Track Job
                      </button>
                    </div>
                  </article>
                ))}
      
                {filteredJobs.length === 0 && (
                  <p className="muted-text">No jobs found.</p>
                )}
              </div>
            </div>
          );
        }
      
        ReactDOM.createRoot(document.getElementById("jobs-root")).render(<JobsApp />);
      </script>
